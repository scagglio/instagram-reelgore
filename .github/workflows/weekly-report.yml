name: ReelGore weekly report

on:
  schedule:
    - cron: "7 14 * * 1"     # Mondays 9:07 AM CDT (8:07 AM CST)
    - cron: "37 16 * * 1"    # backup, in case GitHub drops the first one
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: reelgore-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this week's report already exists
        if: github.event_name == 'schedule'
        run: |
          if [ -f "reports/$(TZ=America/Chicago date +%F).md" ]; then echo "SKIP=true" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests PyYAML
        if: env.SKIP != 'true'

      - name: Pull Instagram Insights and update rotation weights
        if: env.SKIP != 'true'
        run: |
          python -m reelgore.main report
          f=$(ls -t reports/*.md | head -1)
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
          echo "REPORT=$f" >> "$GITHUB_ENV"

      - name: Save report and weights
        if: env.SKIP != 'true'
        run: |
          git config user.name "reelgore-bot"
          git config user.email "reelgore-bot@users.noreply.github.com"
          git add data/weights.json reports/
          git commit -m "weekly report: $(date -u +%F)" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Email the report (opens a GitHub issue; GitHub emails you about new issues)
        if: env.SKIP != 'true'
        run: |
          gh issue create --title "Reel Gore weekly report: $(TZ=America/Chicago date +'%b %-d')" --body-file "$REPORT" \
            || echo "Couldn't open an issue (are Issues enabled in repo Settings?). The report is in $REPORT."
