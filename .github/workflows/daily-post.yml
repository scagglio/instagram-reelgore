name: ReelGore daily post (Instagram + Facebook)

on:
  schedule:
    # GitHub doesn't guarantee scheduled runs (they can be late or dropped), so there are backups.
    # The first one that runs posts; later ones see today's scheduled post in history and skip.
    # Times in CDT (subtract 1 hour after the November time change):
    - cron: "7 23 * * *"    # 6:07 PM
    - cron: "37 23 * * *"   # 6:37 PM (backup)
    - cron: "17 0 * * *"    # 7:17 PM (backup)
    - cron: "47 1 * * *"    # 8:47 PM (last backup)
  workflow_dispatch:
    inputs:
      post_type:
        description: "What to post"
        type: choice
        options: [auto, upcoming, classic, anniversary]
        default: auto
      movies:
        description: "Optional: your own movies, comma separated (e.g. Halloween (1978), The Thing, Hereditary). One = deep dive, several = a picks list. Overrides 'What to post'."
        type: string
        required: false
        default: ""
      list_title:
        description: "Optional: title for a multi-movie list (e.g. Slashers for a rainy night)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Render only, don't post to Instagram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reelgore-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # optional; blank = newest Sonnet your key can use
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}   # optional; auto-detected from the token
      PYTHONPATH: src
      POST_REEL: ${{ vars.POST_REEL || 'true' }}
      IG_AUDIO_ID: ${{ vars.IG_AUDIO_ID }}   # optional; pin one Instagram track
      POST_FACEBOOK: ${{ vars.POST_FACEBOOK || 'true' }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}     # optional; auto-detected from the linked Page
      AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}   # optional; e.g. reelgore-20
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's scheduled post already went out
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, os, datetime, zoneinfo
          today = datetime.datetime.now(zoneinfo.ZoneInfo("America/Chicago")).date().isoformat()
          try:
              posts = json.load(open("data/history.json"))["posts"]
          except Exception:
              posts = []
          done = any(p.get("date") == today and p.get("trigger") == "schedule" for p in posts)
          print(f"Central date {today}: scheduled post already done = {done}")
          if done:
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("SKIP=true\n")
          PY

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: env.SKIP != 'true'

      - name: Fetch headline font (Bebas Neue, OFL)
        if: env.SKIP != 'true'
        run: curl -sSfL -o assets/fonts/BebasNeue-Regular.ttf https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf || echo "Bebas download failed; falling back to Inter Display Black"

      - name: Pick movies, write copy, render slides
        if: env.SKIP != 'true'
        env:
          MOVIES: ${{ inputs.movies }}
          LIST_TITLE: ${{ inputs.list_title }}
          POST_TYPE_IN: ${{ inputs.post_type || 'auto' }}
        run: python -m reelgore.main plan --type "$POST_TYPE_IN"

      - name: Save slides as a run artifact (for review)
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reelgore-${{ github.run_id }}
          path: out/

      - name: Host slides on the media branch (Instagram needs public image URLs)
        id: host
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        run: |
          set -e
          DIR="posts/$(date -u +%F)-${{ github.run_id }}"
          git config user.name "reelgore-bot"
          git config user.email "reelgore-bot@users.noreply.github.com"
          # Build the media branch in a separate worktree so the main checkout never changes branch.
          MEDIA="$RUNNER_TEMP/media"
          if git ls-remote --exit-code --heads origin media >/dev/null; then
            git fetch origin media:refs/remotes/origin/media
            git worktree add -B media "$MEDIA" origin/media
          else
            git worktree add --detach "$MEDIA"
            git -C "$MEDIA" switch --orphan media
          fi
          mkdir -p "$MEDIA/$DIR"
          cp out/*.jpg "$MEDIA/$DIR/"
          [ -f out/reel.mp4 ] && cp out/reel.mp4 "$MEDIA/$DIR/"
          git -C "$MEDIA" add "$DIR"
          git -C "$MEDIA" commit -m "media: $DIR"
          git -C "$MEDIA" push origin media
          git worktree remove --force "$MEDIA"
          echo "base=https://raw.githubusercontent.com/${{ github.repository }}/media/$DIR" >> "$GITHUB_OUTPUT"
          sleep 10

      - name: Publish carousel to Instagram
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        run: python -m reelgore.main publish --base-url "${{ steps.host.outputs.base }}"

      - name: Commit post history
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        run: |
          git add data/ docs/ 2>/dev/null || git add data/
          git commit -m "history: $(date -u +%F) post" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
