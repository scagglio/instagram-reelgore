# ReelGore brand + content config. Edit freely — the agent reads this every run.
account:
  handle: "@reelgore26"
  name: "Reel Gore"
  tagline: "Where horror thrives."
  site: "reelgore.net"
  since: 2010

voice: |
  You write for Reel Gore, a horror movie review page that has been running since 2010.
  The voice is a lifelong horror fan talking to other horror fans: knowledgeable, a little
  macabre, playful, never snobby. Loves slashers, Universal monsters, 70s/80s grindhouse,
  Italian horror, and overlooked indie and direct-to-video gems as much as big studio releases.
  Celebrates practical effects and gore craft. Short punchy lines. Dark humor is welcome;
  mean-spiritedness is not. No spoilers past the first act unless a slide is clearly
  labeled "SPOILER". Sign-off phrase used sparingly: "Dance macabre with us."
  Never invent facts: only use the facts provided (dates, cast, director, runtime, plot).
  If a fact isn't provided, don't state it.

# Rotation for the daily post. "auto" uses this order by day of year,
# but a big milestone anniversary on today's date always wins.
rotation: [upcoming, classic, anniversary]

anniversary:
  milestone_years: [2, 3, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80, 90, 100]
  window_days: 0          # 0 = exact release date only; raise to allow "this week" anniversaries
  min_vote_count: 150     # skip obscure titles with too few TMDB votes for anniversaries

classic:
  max_year: 1999
  min_vote_count: 200
  # Sub-genre flavors to rotate through for "From the Crypt" classic picks
  themes:
    - slasher
    - universal monsters
    - italian giallo
    - 80s practical effects
    - zombie
    - folk horror
    - creature feature
    - grindhouse and cult
    - haunted house
    - body horror

upcoming:
  days_ahead: 120
  region: US
  roundups_per_month: 1   # "Coming to haunt you" roundups per calendar month (0 = none); other days post something else

slides:
  count_min: 5
  count_max: 8
  width: 1080
  height: 1350           # 4:5 portrait, the tallest carousel ratio Instagram allows
  palette:
    blood: "#B3121B"
    bone: "#F2E6D0"
    ink: "#0B0B0D"
    rust: "#D9663B"
  fonts:
    # First file that exists wins. Bebas Neue is downloaded by the workflow; Inter ships in the repo.
    headline: ["assets/fonts/BebasNeue-Regular.ttf", "assets/fonts/InterDisplay-Black.otf"]
    body: "assets/fonts/Inter-Regular.otf"
    body_bold: "assets/fonts/Inter-Bold.otf"

hashtags:
  always: ["#reelgore", "#horror", "#horrormovies", "#horrorcommunity"]
  pool:
    - "#horrorfan"
    - "#horrorfilms"
    - "#horroraddict"
    - "#horrorjunkie"
    - "#slasher"
    - "#cultfilm"
    - "#80shorror"
    - "#classichorror"
    - "#horrormovie"
    - "#scarymovies"
    - "#horrorfamily"
    - "#practicaleffects"
    - "#upcominghorror"
    - "#horrornews"
  max_total: 15

# Reel music. Picks a trending Instagram track whose title/artist matches a keyword;
# if none is trending, takes the top result of the searches below. Set IG_AUDIO_ID (repo variable)
# to force one specific track. Falls back to the generated soundtrack if Instagram rejects the track.
music:
  use_instagram_music: true
  keywords: [horror, scary, creepy, spooky, halloween, haunted, dark, nightmare, terror, scream, ghost,
             demon, evil, monster, thriller, suspense, killer, blood, witch, phonk]
  searches: ["horror", "scary", "creepy", "halloween", "suspense", "dark ambient"]
  no_repeat_days: 14
  volume: 100

# Cross-post every day's content to the Reel Gore Facebook Page (same token; needs pages_manage_posts).
# Facebook Reels can't use Instagram's licensed music, so the Facebook Reel keeps the generated soundtrack.
facebook:
  enabled: true
  post_photos: true      # the slides as one multi-photo post
  post_reel: true        # the Reel as a Facebook Reel
  max_hashtags: 4
  instagram_plug: "More horror daily on Instagram: {handle}"

# "Where to watch / own it" slide + affiliate links (classic and anniversary posts; upcoming films aren't out yet).
# Instagram captions can't hold clickable links, so the slide says "link in bio" and the links live on the
# link-in-bio page (docs/index.html via GitHub Pages) and in the Facebook post.
affiliate:
  enabled: true
  post_types: [classic, anniversary]
  region: US
  max_services: 4
  amazon_tag: ""            # or set the repo variable AMAZON_ASSOCIATE_TAG (e.g. reelgore-20)
  # Affiliate URLs for streaming services you're approved for. {title} is filled in. Example:
  # provider_links:
  #   Shudder: "https://your-affiliate-network.example/shudder?ref=reelgore"
  provider_links: {}
  # Extra "own it" shops, e.g. a boutique label's affiliate search:
  # extra_shops:
  #   - label: "Vinegar Syndrome"
  #     url: "https://vinegarsyndrome.com/search?q={title}"
  extra_shops: []
  # Always-on buttons at the top of the link page (your merch shop, etc.)
  pinned_links: []
  #   - label: "Reel Gore merch"
  #     url: "https://www.etsy.com/shop/YOURSHOP"
  ig_link_line: "Own it on 4K: link in bio"
  disclosure: "#ad Affiliate links: we may earn a commission at no extra cost to you."
  page_disclosure: "Some links are affiliate links. As an Amazon Associate we earn from qualifying purchases."
  page_items: 30

# Seasonal series. While a series is active, every daily post becomes a numbered entry:
# a "NIGHT 06/31" badge on the cover, the series hashtag first, and a caption that teases tomorrow.
series:
  - name: "31 Nights of Horror"
    hashtag: "#31NightsOfHorror"
    start: "10-01"        # MM-DD, inclusive
    end: "10-31"
    badge: "NIGHT {n:02d}/{total}"

# Engagement: every caption ends with a pick-one debate question instead of an open "thoughts?".
engagement:
  cta_examples:
    - "Original or remake? Pick one."
    - "Masterpiece or overrated?"
    - "Would you survive the night: yes or no?"
    - "Rate it in skulls: 1 to 5."
    - "Theater or wait for streaming?"
    - "Scariest scene: the opening or the ending?"

# Daily Story teaser (still image, 9:16): the day's cover with a NEW POST banner, posted after the main posts.
# The API can't add link/poll stickers. A failed story is logged but never fails the run.
stories:
  enabled: true
  instagram: true
  facebook: true
